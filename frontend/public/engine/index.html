<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Inline-4 Realistic Aero-Engine Digital Twin</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080c14;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #info {
            position: absolute;
            top: 12px;
            left: 12px;
            color: #f8fafc;
            font-size: 13px;
            background: rgba(15, 23, 42, 0.88);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.35);
            pointer-events: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .hud-slider-group {
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #94a3b8;
        }

        .hud-slider-group input[type="range"] {
            cursor: pointer;
            accent-color: #38bdf8;
            width: 110px;
        }

        .hud-btn {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .hud-btn:hover {
            background: rgba(56, 189, 248, 0.4);
            color: #fff;
        }
    </style>

    <!-- Local vendor scripts loaded via relative paths (works from FastAPI /3d-viewer route) -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/OrbitControls.js"></script>
</head>

<body>
    <div id="info">
        ✈️ <b>Realistic Inline-4 Aero-Piston Engine Digital Twin</b><br>
        <div id="telemetry-status" style="margin-top:8px;color:#6de2c0;font-size:11px">Waiting for synchronized telemetry</div>
        <div class="hud-slider-group">
            <span>🔍 Shell Opacity:</span>
            <input type="range" id="opacity-slider" min="0.05" max="1.0" step="0.05" value="0.20"
                oninput="if(window.setEngineShellOpacity) window.setEngineShellOpacity(this.value); document.getElementById('opacity-val').innerText = Math.round(this.value*100) + '%';">
            <span id="opacity-val" style="color: #38bdf8; font-weight: 700; width: 38px;">20%</span>
            <button class="hud-btn" onclick="if(window.toggleGlassCutaway) window.toggleGlassCutaway()">👁️ Cutaway</button>
        </div>
    </div>

    <!-- Interactive Component Inspection Overlay HUD -->
    <div id="inspector-hud"
        style="display: none; position: absolute; bottom: 20px; left: 20px; background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 10px; padding: 14px 18px; color: #f8fafc; font-family: sans-serif; backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,0.6); max-width: 320px; z-index: 100;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span id="hud-title" style="font-weight: 700; font-size: 14px; color: #38bdf8;">Component Name</span>
            <button onclick="document.getElementById('inspector-hud').style.display='none'"
                style="background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer;">✕</button>
        </div>
        <div id="hud-content" style="font-size: 12px; line-height: 1.5; color: #cbd5e1;">
            Select any engine component to inspect live sensor readings and physics residuals.
        </div>
    </div>

    <script src="viewer.js?v=20260927_04"></script>

    <!-- Auto-resize canvas to fill iframe on load -->
    <script>
        (function () {
            function syncCanvasSize() {
                var w = window.innerWidth || document.documentElement.clientWidth || 800;
                var h = window.innerHeight || document.documentElement.clientHeight || 600;
                if (w < 50 || h < 50) return;
                var canvas = document.querySelector('canvas');
                if (!canvas) return;
                try {
                    canvas.style.width = w + 'px';
                    canvas.style.height = h + 'px';
                    if (typeof THREE !== 'undefined' && window._engineRenderer) {
                        window._engineRenderer.setSize(w, h, false);
                        if (window._engineCamera) {
                            window._engineCamera.aspect = w / h;
                            window._engineCamera.updateProjectionMatrix();
                        }
                    }
                } catch (e) { }
            }
            window.addEventListener('load', function () { setTimeout(syncCanvasSize, 50); setTimeout(syncCanvasSize, 200); });
            window.addEventListener('resize', syncCanvasSize);
        })();
    </script>
</body>

</html>
